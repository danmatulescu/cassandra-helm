{{- if and .Values.auth.enabled (not .Values.auth.superuser.existingSecret) }}
{{- $name := include "cassandra.superuserSecretName" . }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cassandra.labels" . | nindent 4 }}
  annotations:
    # The role lives on in the data volumes, which are also retained.
    helm.sh/resource-policy: keep
type: kubernetes.io/basic-auth
data:
  username: {{ .Values.auth.superuser.name | b64enc }}
  password: {{ include "cassandra.secretValue" (dict "ctx" . "name" $name "key" "password") }}
{{- end }}
{{- range $kind := splitList "," (include "cassandra.tlsKinds" .) | compact }}
{{- if not (index $.Values.tls $kind).passwordSecret }}
{{- $name := include "cassandra.tlsPasswordSecretName" (dict "ctx" $ "kind" $kind) }}
---
# Password for the {{ $kind }} PKCS12 keystore / truststore.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "cassandra.labels" $ | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  password: {{ include "cassandra.secretValue" (dict "ctx" $ "name" $name "key" "password") }}
{{- end }}
{{- end }}
