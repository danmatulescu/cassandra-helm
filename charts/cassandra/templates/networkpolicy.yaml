{{- if .Values.networkPolicy.enabled }}
# Internode (7000) only from this release's Cassandra pods; CQL (9042) from
# networkPolicy.cqlFrom (or anyone). Other ports are closed. JMX listens on
# localhost only, and the maintenance jobs reach nodetool via kubectl exec
# (API server), not over the pod network.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "cassandra.fullname" . }}
  labels:
    {{- include "cassandra.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "cassandra.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "cassandra.selectorLabels" . | nindent 14 }}
      ports:
        - port: 7000
          protocol: TCP
    - ports:
        - port: 9042
          protocol: TCP
      {{- with .Values.networkPolicy.cqlFrom }}
      from:
        {{- toYaml . | nindent 8 }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cassandra.name" $ }}-auth-bootstrap
              app.kubernetes.io/instance: {{ $.Release.Name }}
        # helm test pod (needs 9042 as its control check)
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "cassandra.name" $ }}-netpol-test
              app.kubernetes.io/instance: {{ $.Release.Name }}
      {{- end }}
{{- end }}
